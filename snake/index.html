<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; flex-direction: column; }
h1 { color: #44ff88; text-shadow: 0 0 20px #44ff8888; margin-bottom: 10px; font-size: 2em; letter-spacing: 4px; }
#gameArea { display: flex; gap: 20px; align-items: flex-start; }
canvas { border: 2px solid #44ff88; box-shadow: 0 0 30px #44ff8844, inset 0 0 30px #00000088; border-radius: 4px; }
#sidePanel { display: flex; flex-direction: column; gap: 12px; width: 160px; }
.statBox { background: #0d0d20; border: 2px solid #334; border-radius: 4px; padding: 8px; text-align: center; }
.statLabel { color: #556; font-size: 0.65em; text-transform: uppercase; letter-spacing: 2px; }
.statValue { color: #44ff88; font-size: 1.3em; font-weight: bold; text-shadow: 0 0 10px #44ff8866; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border-radius: 4px; }
#overlay h2 { color: #44ff88; font-size: 1.8em; margin-bottom: 12px; text-shadow: 0 0 20px #44ff8888; }
#overlay p { color: #aab; margin-bottom: 15px; font-size: 0.85em; text-align: center; line-height: 1.8; }
#overlay input { background: #1a1a30; border: 2px solid #44ff88; color: #44ff88; padding: 8px 20px; font-size: 0.95em; cursor: pointer; border-radius: 4px; transition: all 0.2s; letter-spacing: 2px; }
#overlay input:hover { background: #44ff88; color: #0a0a1a; box-shadow: 0 0 20px #44ff8866; }
#controls { color: #445; font-size: 0.65em; text-align: center; margin-top: 12px; letter-spacing: 1px; }
#foodLegend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.65em; }
.legendItem { display: flex; align-items: center; gap: 4px; }
.legendDot { width: 10px; height: 10px; border-radius: 2px; }
.foodTypes { display:grid; grid-template-columns: repeat(4,1fr); gap:4px; font-size:0.6em; }
.foodType { text-align:center; }
</style>
</head>
<body>
<h1>SNAKE</h1>
<div id="gameArea">
<div style="position:relative">
<canvas id="board"></canvas>
<div id="overlay">
<h2>SNAKE</h2>
<p>← ↑ ↓ → движение<br>пробел пауза<br>собирайте еду для очков!</p>
<input type="button" value="СТАРТ" id="startBtn">
</div>
</div>
<div id="sidePanel">
<div class="statBox"><div class="statLabel">Счёт</div><div class="statValue" id="score">0</div></div>
<div class="statBox"><div class="statLabel">Длина</div><div class="statValue" id="length">3</div></div>
<div class="statBox"><div class="statLabel">Уровень</div><div class="statValue" id="level">1</div></div>
<div class="statBox" style="font-size:0.6em; padding:6px;">
<div style="color:#556; margin-bottom:4px;">ЕДА:</div>
<div class="foodTypes">
<div class="foodType"><div style="background:#44ff88; width:12px;height:12px;margin:0 auto;border-radius:2px;"></div>+1</div>
<div class="foodType"><div style="background:#ffaa22; width:12px;height:12px;margin:0 auto;border-radius:2px;"></div>+3</div>
<div class="foodType"><div style="background:#ff4466; width:12px;height:12px;margin:0 auto;border-radius:2px;"></div>x2</div>
<div class="foodType"><div style="background:#4488ff; width:12px;height:12px;margin:0 auto;border-radius:2px;"></div>щит</div>
</div>
</div>
</div>
</div>
</div>
<div id="controls">← ↑ ↓ → ДВИЖЕНИЕ &nbsp;|&nbsp; ПРОБЕЛ ПАУЗА</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const W = 20, H = 20;
const CELL = 24;
canvas.width = W * CELL;
canvas.height = H * CELL;

const FOOD_TYPES = [
  {color:'#44ff88', name:'обычная', grow:1, score:10, dur:0},
  {color:'#ffaa22', name:'золотая', grow:3, score:30, dur:0},
  {color:'#ff4466', name:'огненная', grow:0, score:50, dur:0, mult:1},
  {color:'#4488ff', name:'морозная', grow:0, score:0, dur:5000, shield:1},
  {color:'#aa44ff', name:'радужная', grow:2, score:100, dur:3000}
];

let snake = [];
let food = [];
let obstacles = [];
let dir = {x:1, y:0};
let nextDir = {x:1, y:0};
let score = 0;
let level = 1;
let gameOver = false;
let paused = false;
let animFrame = null;
let lastFrame = 0;
let speed = 120;
let doubleScore = 0;
let shield = 0;
let particles = [];

function init() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  level = 1;
  speed = 120;
  gameOver = false;
  paused = false;
  doubleScore = 0;
  shield = 0;
  particles = [];
  
  obstacles = [];
  for (let i = 0; i < 8 + level * 2; i++) {
    let ox, oy;
    do {
      ox = Math.floor(Math.random() * W);
      oy = Math.floor(Math.random() * H);
    } while (distToSnake(ox, oy) < 4);
    obstacles.push({x:ox, y:oy});
  }
  
  food = [];
  spawnFood();
  for (let i = 0; i < 2; i++) spawnFood();
  
  overlay.style.display = 'none';
  updateUI();
  if (animFrame) cancelAnimationFrame(animFrame);
  lastFrame = performance.now();
  animFrame = requestAnimationFrame(gameLoop);
}

function distToSnake(x, y) {
  let min = 999;
  for (let s of snake) {
    let d = Math.abs(s.x - x) + Math.abs(s.y - y);
    if (d < min) min = d;
  }
  return min;
}

function spawnFood() {
  let ft;
  let r = Math.random();
  if (r < 0.5) ft = 0;
  else if (r < 0.75) ft = 1;
  else if (r < 0.9) ft = 2;
  else if (r < 0.95) ft = 3;
  else ft = 4;
  
  let fx, fy;
  let tries = 0;
  do {
    fx = Math.floor(Math.random() * W);
    fy = Math.floor(Math.random() * H);
    tries++;
  } while ((distToSnake(fx, fy) < 2 || isObstacle(fx, fy)) && tries < 100);
  
  if (tries < 100) {
    food.push({x:fx, y:fy, type:ft, life:10000});
  }
}

function isObstacle(x, y) {
  return obstacles.some(o => o.x === x && o.y === y);
}

function grow(n) {
  let tail = snake[snake.length - 1];
  for (let i = 0; i < n; i++) {
    snake.push({x:tail.x, y:tail.y});
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    let angle = Math.random() * Math.PI * 2;
    let spd = 1 + Math.random() * 3;
    particles.push({
      x: x * CELL + CELL/2,
      y: y * CELL + CELL/2,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      color: color,
      size: 3 + Math.random() * 3
    });
  }
}

function gameLoop(now) {
  if (gameOver) return;
  animFrame = requestAnimationFrame(gameLoop);
  if (paused) {
    lastFrame = now;
    return;
  }

  let delta = now - lastFrame;
  if (delta < speed) return;
  lastFrame = now;

  dir = {...nextDir};

  let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H ||
      isObstacle(head.x, head.y) ||
      (shield <= 0 && snake.some(s => s.x === head.x && s.y === head.y))) {
    if (shield > 0) {
      spawnParticles(head.x, head.y, '#4488ff', 10);
      shield -= 1000;
      dir = {x:-dir.x, y:-dir.y};
      nextDir = {...dir};
      head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    } else {
      gameOver = true;
      overlay.style.display = 'flex';
      overlay.querySelector('h2').textContent = 'GAME OVER';
      overlay.querySelector('p').innerHTML = 'Счёт: ' + score + '<br>Длина: ' + snake.length;
      startBtn.value = 'ЗАНОВО';
      return;
    }
  }

  snake.unshift(head);
  let ate = false;
  
  for (let i = food.length - 1; i >= 0; i--) {
    let f = food[i];
    if (head.x === f.x && head.y === f.y) {
      let ft = FOOD_TYPES[f.type];
      let mult = doubleScore > 0 ? 2 : 1;
      score += ft.score * mult;
      ate = true;
      
      spawnParticles(f.x, f.y, ft.color, 12);
      
      if (ft.grow > 0) grow(ft.grow);
      if (ft.mult) doubleScore = ft.dur;
      if (ft.shield) shield = ft.dur;
      
      food.splice(i, 1);
      spawnFood();
      
      if (ft.type === 2) {
        let tail = snake[snake.length - 1];
        for (let j = 0; j < 3; j++) {
          snake.push({x: tail.x, y: tail.y});
        }
      }
    }
  }
  
  if (!ate) {
    snake.pop();
  }

  let newLevel = Math.floor(snake.length / 5);
  if (newLevel > level) {
    level = newLevel;
    speed = Math.max(50, 120 - level * 8);
    spawnFood();
  }

  if (doubleScore > 0) doubleScore -= speed;
  if (shield > 0) shield -= speed;
  for (let f of food) {
    f.life -= speed;
  }
  food = food.filter(f => f.life > 0);
  
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }

  draw();
  updateUI();
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      let isGrid = (x + y) % 2 === 0;
      ctx.globalAlpha = isGrid ? 0.05 : 0.08;
      ctx.fillStyle = '#334';
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
  ctx.globalAlpha = 1;

  for (let o of obstacles) {
    ctx.fillStyle = '#334455';
    ctx.fillRect(o.x * CELL + 2, o.y * CELL + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = '#445566';
    ctx.fillRect(o.x * CELL + 4, o.y * CELL + 4, CELL - 8, CELL - 8);
  }

  for (let f of food) {
    let ft = FOOD_TYPES[f.type];
    let pulse = Math.sin(performance.now() * 0.008) * 0.2 + 0.8;
    ctx.globalAlpha = f.life < 3000 ? f.life / 3000 : pulse;
    
    let cx = f.x * CELL + CELL/2;
    let cy = f.y * CELL + CELL/2;
    
    ctx.fillStyle = ft.color;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.35, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.globalAlpha = ft.type === 4 ? (Math.sin(performance.now() * 0.015) * 0.5 + 0.5) : 1;
    if (ft.type === 4) {
      ctx.strokeStyle = ft.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.4, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  for (let i = 0; i < snake.length; i++) {
    let s = snake[i];
    let isHead = i === 0;
    let ratio = i / snake.length;
    let r = Math.floor(68 * ratio + 40);
    let g = Math.floor(255 * (1 - ratio * 0.5));
    let b = Math.floor(136 * (1 - ratio));
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    
    let pad = isHead ? 1 : 2;
    let sz = isHead ? CELL - 2 : CELL - 4;
    ctx.beginPath();
    ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, sz, sz, 4);
    ctx.fill();
    
    if (isHead) {
      let eyeSize = 4;
      let eyeOff = 6;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x * CELL + CELL/2 - eyeOff, s.y * CELL + CELL/2 - eyeOff, eyeSize, 0, Math.PI * 2);
      ctx.arc(s.x * CELL + CELL/2 + eyeOff, s.y * CELL + CELL/2 - eyeOff, eyeSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      let dx = dir.x * 2;
      let dy = dir.y * 2;
      ctx.arc(s.x * CELL + CELL/2 - eyeOff + dx, s.y * CELL + CELL/2 - eyeOff + dy, 2, 0, Math.PI * 2);
      ctx.arc(s.x * CELL + CELL/2 + eyeOff + dx, s.y * CELL + CELL/2 - eyeOff + dy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (shield > 0) {
    ctx.globalAlpha = 0.3 + Math.sin(performance.now() * 0.01) * 0.2;
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 3;
    let head = snake[0];
    ctx.beginPath();
    ctx.arc(head.x * CELL + CELL/2, head.y * CELL + CELL/2, CELL * 0.8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('length').textContent = snake.length;
  document.getElementById('level').textContent = level;
}

document.addEventListener('keydown', e => {
  if (gameOver) return;
  if (e.key === ' ' || e.key === 'Escape') {
    paused = !paused;
    e.preventDefault();
    return;
  }
  if (paused) return;
  
  if (e.key === 'ArrowUp' && dir.y !== 1) nextDir = {x:0, y:-1};
  else if (e.key === 'ArrowDown' && dir.y !== -1) nextDir = {x:0, y:1};
  else if (e.key === 'ArrowLeft' && dir.x !== 1) nextDir = {x:-1, y:0};
  else if (e.key === 'ArrowRight' && dir.x !== -1) nextDir = {x:1, y:0};
  e.preventDefault();
});

startBtn.addEventListener('click', init);

draw();
overlay.style.display = 'flex';
</script>
</body>
</html>
